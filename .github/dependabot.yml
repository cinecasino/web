version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check solo admite TypeScript ^5 || ^6. Quita esto cuando su peerDependency acepte la 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Astro y sus adaptadores van juntos para no romper compatibilidades
      astro:
        patterns: ['astro', '@astrojs/*']
      otras:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
