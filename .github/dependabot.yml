version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Astro y sus adaptadores van juntos para no romper compatibilidades
      astro:
        patterns: ['astro', '@astrojs/*']
      otras:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
