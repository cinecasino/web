name: Pages

# Publica la web estática en GitHub Pages cuando el CI de un push a main termina en verde.
# Requisitos (una vez): Settings → Pages → Source: "GitHub Actions", y en Settings → Secrets and variables → Actions:
#   - recomendado: la variable PUBLIC_TMDB_PROXY con la URL del Worker de Cloudflare (worker.yml); el token no sale en la web
#   - o, sin Worker: el secreto PUBLIC_TMDB_TOKEN, que acaba en el JavaScript público.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar acceso a TMDB
        # (Lighthouse corre en el CI, antes de llegar aquí: si la web empeora, no se publica)
        env:
          PUBLIC_TMDB_PROXY: ${{ vars.PUBLIC_TMDB_PROXY }}
          PUBLIC_TMDB_TOKEN: ${{ secrets.PUBLIC_TMDB_TOKEN }}
        run: |
          if [ -n "$PUBLIC_TMDB_PROXY" ]; then
            echo "✅ Usando el Worker: $PUBLIC_TMDB_PROXY (el token no se incluye en la web)"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://cinecasino.github.io' "${PUBLIC_TMDB_PROXY%/}/3/movie/550")
            [ "$code" = 200 ] || { echo "::error::El Worker no responde bien ($code). Revisa worker.yml antes de publicar."; exit 1; }
          elif [ -n "$PUBLIC_TMDB_TOKEN" ]; then
            echo "::warning::Sin Worker: el token de TMDB irá en el JavaScript público. Mejor despliega worker/ y crea la variable PUBLIC_TMDB_PROXY."
          else
            echo "::error::Falta la variable PUBLIC_TMDB_PROXY o el secreto PUBLIC_TMDB_TOKEN. Sin uno de los dos no cargarían las películas."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # El commit exacto que pasó el CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Compilar (modo pages)
        env:
          # "" si el repo es <org>.github.io (raíz), "/<repo>" si es un repo normal
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_TMDB_PROXY: ${{ vars.PUBLIC_TMDB_PROXY }}
          PUBLIC_TMDB_TOKEN: ${{ secrets.PUBLIC_TMDB_TOKEN }}
        run: |
          # Con Worker, el token no debe llegar al JavaScript publicado: se quita del entorno y se comprueba
          token="$PUBLIC_TMDB_TOKEN"
          if [ -n "$PUBLIC_TMDB_PROXY" ]; then unset PUBLIC_TMDB_TOKEN; fi
          npm run build
          if [ -n "$PUBLIC_TMDB_PROXY" ] && [ -n "$token" ] && grep -rqF "$token" dist; then
            echo "::error::El token de TMDB ha aparecido en dist/"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprobar que la web responde
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          URL="${URL%/}"
          for path in / /tragaperras/ /landing/ /manifest.webmanifest; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
              [ "$code" = 200 ] && break
              sleep 10
            done
            [ "$code" = 200 ] && echo "✅ $URL$path" || { echo "::error::$URL$path → $code"; exit 1; }
          done
