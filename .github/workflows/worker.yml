name: Worker TMDB

# Despliega el proxy de TMDB (worker/) en Cloudflare Workers cuando cambia, o a mano.
# Requisitos (una vez), en Settings → Secrets and variables → Actions:
#   secretos CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID y TMDB_TOKEN.
# Después, la variable PUBLIC_TMDB_PROXY con la URL del Worker hace que Pages lo use.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/lib/tmdb-routes.ts', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar secretos
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$TMDB_TOKEN" ] || missing="$missing TMDB_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Faltan secretos:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Desplegar
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.152.0'
          secrets: TMDB_TOKEN
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Comprobar que el Worker responde
        env:
          URL: ${{ steps.wrangler.outputs.deployment-url || vars.PUBLIC_TMDB_PROXY }}
        run: |
          URL="${URL%/}"
          if [ -z "$URL" ]; then echo "::warning::No se conoce la URL del Worker: crea la variable PUBLIC_TMDB_PROXY"; exit 0; fi
          echo "Worker: $URL"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for i in 1 2 3 4 5 6; do [ "$(code "$URL/health")" = 200 ] && break; sleep 5; done
          curl -s "$URL/health" | grep -q '"tmdb":true' && echo "✅ salud y secreto TMDB_TOKEN" || { echo "::error::El Worker no tiene TMDB_TOKEN"; exit 1; }
          c=$(code -H 'Origin: https://cinecasino.github.io' "$URL/3/movie/550?language=es-ES")
          [ "$c" = 200 ] && echo "✅ ruta permitida → 200" || { echo "::error::/3/movie/550 → $c (¿token de TMDB válido?)"; exit 1; }
          c=$(code "$URL/3/account/1")
          [ "$c" = 404 ] && echo "✅ ruta fuera de la lista → 404" || { echo "::error::/3/account/1 → $c"; exit 1; }
          c=$(code -H 'Origin: https://otra-web.example' "$URL/3/movie/550")
          [ "$c" = 403 ] && echo "✅ origen ajeno → 403" || { echo "::error::origen ajeno → $c"; exit 1; }
          echo "### Worker desplegado: $URL" >> "$GITHUB_STEP_SUMMARY"
