name: Worker TMDB

# El proxy de TMDB (worker/) lo despliega la integración de Git de Cloudflare en cada push.
# Este workflow solo comprueba que el Worker publicado funciona: responde, tiene el token,
# bloquea rutas fuera de la lista y rechaza otras webs. Usa la variable PUBLIC_TMDB_PROXY.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/lib/tmdb-routes.ts', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Comprobar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar el Worker publicado
        env:
          URL: ${{ vars.PUBLIC_TMDB_PROXY }}
        run: |
          URL="${URL%/}"
          if [ -z "$URL" ]; then echo "::warning::Crea la variable PUBLIC_TMDB_PROXY con la URL del Worker para comprobarlo"; exit 0; fi
          echo "Worker: $URL"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # Cloudflare compila y despliega a la vez que corre esto: se le da hasta ~5 minutos
          for i in $(seq 1 30); do
            curl -s "$URL/health" | grep -q '"ok":true' && break
            [ "$i" = 30 ] && { echo "::error::$URL/health no responde como el proxy. ¿Root directory = worker en Cloudflare?"; exit 1; }
            sleep 10
          done
          curl -s "$URL/health" | grep -q '"tmdb":true' && echo "✅ salud y secreto TMDB_TOKEN" || { echo "::error::Al Worker le falta el secreto TMDB_TOKEN (Settings → Variables and Secrets)"; exit 1; }
          c=$(code -H 'Origin: https://cinecasino.github.io' "$URL/3/movie/550?language=es-ES")
          [ "$c" = 200 ] && echo "✅ ruta permitida → 200" || { echo "::error::/3/movie/550 → $c (¿token de TMDB válido?)"; exit 1; }
          c=$(code "$URL/3/account/1")
          [ "$c" = 404 ] && echo "✅ ruta fuera de la lista → 404" || { echo "::error::/3/account/1 → $c"; exit 1; }
          c=$(code -H 'Origin: https://otra-web.example' "$URL/3/movie/550")
          [ "$c" = 403 ] && echo "✅ origen ajeno → 403" || { echo "::error::origen ajeno → $c"; exit 1; }
          echo "### ✅ Worker funcionando: $URL" >> "$GITHUB_STEP_SUMMARY"
