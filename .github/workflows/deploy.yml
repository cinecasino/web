name: Deploy

# Publica en Vercel (producción) cuando el CI de un push a main termina en verde.
# Vercel no despliega por su cuenta (vercel.json → git.deploymentEnabled: false): solo este workflow.
# Necesita los secretos VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID (ver README → Publicar).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Producción (Vercel)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Comprobar secretos
        run: |
          missing=""
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repo:$missing. Añádelos en Settings → Secrets and variables → Actions (ver README → Publicar)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # El commit exacto que pasó el CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar Vercel CLI
        run: npm install --global vercel@64

      - name: Descargar configuración del proyecto
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Compilar
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Desplegar
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url"

      - name: Comprobar que la web responde
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -u
          check() {
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$1")
              [ "$code" = "$2" ] && { echo "✅ $1 → $code"; return 0; }
              sleep 5
            done
            echo "::error::$1 → $code (esperado $2). $3"
            return 1
          }
          fail=0
          check / 200 "La web no carga." || fail=1
          if ! check /api/health 200 "Servidor mal configurado:"; then
            curl -s "$URL/api/health"; echo
            echo "::error::Revisa en Vercel → Settings → Environment Variables: DATABASE_URL, DATABASE_AUTH_TOKEN (Turso) y TMDB_TOKEN."
            fail=1
          fi
          check "/api/tmdb/trending/all/week?language=es-ES" 200 "El proxy de TMDB falla: revisa que TMDB_TOKEN sea válido." || fail=1
          exit $fail
